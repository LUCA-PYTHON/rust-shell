[package]
name = "rust-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
crossterm = "0.28"
eframe = "0.37.0"

[[bin]]
name = "rust-shell-cli"
path = "src/main.rs"

[[bin]]
name = "rust-shell"
path = "src/bin/gui.rs"

[package.metadata.packager]
product-name = "Rust Shell"
identifier = "de.luca.rustshell"
description = "Eigene Shell in Rust mit eigenem Fenster"
category = "Utility"
authors = ["LUCA-PYTHON"]
icons = ["assets/icon.png", "assets/icon.ico"]
out-dir = "dist"
binaries = [{ path = "rust-shell", main = true }]
before-packaging-command = "cargo build --release --bin rust-shell"